<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台北一日遊</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/thankyou.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <script src="/static/js/auth.js" defer></script>
  <script src="/static/js/thankyou.js" defer></script>
</head>
<body>
  <header class="navbar">
    <div class="navbar__inner">
      <a class="navbar__logo" href="/">台北一日遊</a>
      <nav class="navbar__actions">
        <button type="button" class="navbar__link" id="booking-link">預定行程</button>
        <button type="button" class="navbar__link" id="auth-open">登入 / 註冊</button>
      </nav>
    </div>
  </header>

  <main class="thankyou-main">
    <div class="thankyou-main__inner">
      <section class="thankyou-card" id="thankyou-card">
        <h1 class="thankyou-card__title">行程預訂成功</h1>
        <p class="thankyou-card__lead">感謝您的訂購，我們已收到您的付款。</p>

        <div class="thankyou-order">
          <span class="thankyou-order__label">訂單編號</span>
          <strong class="thankyou-order__number" id="order-number"></strong>
        </div>

        <p class="thankyou-card__hint">導覽人員將於行程前一日以電話與您聯繫，請保持手機暢通。</p>

        <a class="thankyou-card__button" href="/">回到首頁</a>
      </section>

      <section class="thankyou-card" id="thankyou-empty" hidden>
        <h1 class="thankyou-card__title">找不到訂單編號</h1>
        <p class="thankyou-card__lead">此頁面需要從訂購流程進入。</p>
        <a class="thankyou-card__button" href="/">回到首頁</a>
      </section>
    </div>
  </main>

  <footer class="footer">
    <p>COPYRIGHT © 2021 台北一日遊</p>
  </footer>
</body>
</html>
