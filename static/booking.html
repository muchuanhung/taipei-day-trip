<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台北一日遊</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/booking.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <script src="/static/js/auth.js" defer></script>
  <script src="/static/js/booking.js" defer></script>
</head>
<body>
  <header class="navbar">
    <div class="navbar__inner">
      <a class="navbar__logo" href="/">台北一日遊</a>
      <nav class="navbar__actions">
        <button type="button" class="navbar__link" id="booking-link">預定行程</button>
        <button type="button" class="navbar__link" id="auth-open">登入 / 註冊</button>
      </nav>
    </div>
  </header>

  <main class="booking-main">
    <div class="booking-main__inner">
      <section class="booking-section" id="booking-section">
        <h1 class="booking-section__title" id="booking-title">您好，待預訂的行程如下：</h1>

        <div class="booking-item" id="booking-item" hidden>
          <a class="booking-item__image" href="">
            <img src="" alt="" width="266" height="200">
          </a>

          <div class="booking-item__info">
            <div class="booking-item__row booking-item__row--name">
              <a class="booking-item__name" href="">
                <span class="booking-item__label">台北一日遊：</span>
                <span></span>
              </a>
            </div>
            <div class="booking-item__row">
              <span class="booking-item__label">日期：</span>
              <span class="booking-item__value"></span>
            </div>
            <div class="booking-item__row">
              <span class="booking-item__label">時間：</span>
              <span class="booking-item__value"></span>
            </div>
            <div class="booking-item__row">
              <span class="booking-item__label">費用：</span>
              <span class="booking-item__value"></span>
            </div>
            <div class="booking-item__row">
              <span class="booking-item__label">地點：</span>
              <span class="booking-item__value"></span>
            </div>
          </div>

          <button type="button" class="booking-item__delete" id="booking-delete" aria-label="刪除預定行程">
            <img src="/static/images/icon_delete.png" alt="" width="30" height="30">
          </button>
        </div>

        <p class="booking-empty" id="booking-empty" hidden>目前沒有任何待預訂的行程</p>
      </section>

      <div id="booking-checkout" hidden>
        <hr class="booking-divider">

        <section class="booking-form-section">
          <h2 class="booking-form-section__title">您的聯絡資訊</h2>
          <div class="booking-field">
            <label class="booking-field__label" for="contact-name">聯絡姓名：</label>
            <input class="booking-field__input" id="contact-name" type="text" name="name" autocomplete="name">
          </div>
          <div class="booking-field">
            <label class="booking-field__label" for="contact-email">連絡信箱：</label>
            <input class="booking-field__input" id="contact-email" type="email" name="email" autocomplete="email">
          </div>
          <div class="booking-field">
            <label class="booking-field__label" for="contact-phone">手機號碼：</label>
            <input class="booking-field__input" id="contact-phone" type="tel" name="phone" autocomplete="tel" maxlength="10">
          </div>
          <p class="booking-form-section__hint">請保持手機暢通，準時到達，導覽人員將用手機與您聯繫，務必留下正確的聯絡方式。</p>
        </section>

        <hr class="booking-divider">

        <section class="booking-form-section">
          <h2 class="booking-form-section__title">信用卡付款資訊</h2>
          <div class="booking-field">
            <label class="booking-field__label" for="card-number">卡片號碼：</label>
            <input class="booking-field__input" id="card-number" type="text" name="card-number" placeholder="**** **** **** ****" inputmode="numeric" autocomplete="cc-number">
          </div>
          <div class="booking-field">
            <label class="booking-field__label" for="card-expiry">過期時間：</label>
            <input class="booking-field__input" id="card-expiry" type="text" name="card-expiry" placeholder="MM / YY" autocomplete="cc-exp">
          </div>
          <div class="booking-field">
            <label class="booking-field__label" for="card-ccv">驗證密碼：</label>
            <input class="booking-field__input" id="card-ccv" type="text" name="card-ccv" placeholder="CVV" inputmode="numeric" autocomplete="cc-csc">
          </div>
        </section>

        <hr class="booking-divider">

        <section class="booking-confirm">
          <p class="booking-confirm__price" id="booking-total">總價：新台幣 0 元</p>
          <button type="button" class="booking-confirm__button" id="booking-pay">確認訂購並付款</button>
        </section>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>COPYRIGHT © 2021 台北一日遊</p>
  </footer>
</body>
</html>
